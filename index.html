<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wordle en español — adivina la palabra del día en 6 intentos">
  <title>Palabrle</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="data/words.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-theme="light">

  <header>
    <div class="header-inner">
      <h1>Palabrle</h1>
      <div class="header-buttons">
        <button id="btn-stats" aria-label="Estadísticas">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 11V3H8v6H2v12h20V11h-6zM10 5h4v14h-4V5zm-6 8h4v6H4v-6zm16 6h-4v-8h4v8z"/>
          </svg>
        </button>
        <button id="btn-theme" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="toast-container"></div>

  <main>
    <div id="board-container">
      <div id="board"></div>
    </div>
    <div id="keyboard-container"></div>
  </main>

  <!-- Stats modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-stats" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" aria-label="Cerrar">✕</button>
      <h2 id="modal-title">Estadísticas</h2>
      <div id="stats-summary">
        <div class="stat">
          <span class="stat-value" id="stat-played">0</span>
          <span class="stat-label">Jugadas</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-winpct">0</span>
          <span class="stat-label">% Victorias</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-label">Racha actual</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-maxstreak">0</span>
          <span class="stat-label">Mejor racha</span>
        </div>
      </div>
      <h3>Distribución de intentos</h3>
      <div id="stats-distribution"></div>
    </div>
  </div>

</body>
</html>
